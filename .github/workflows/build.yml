name: Windows build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, build, test, publish and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Exercise the published WPF application with mock BLE
        shell: pwsh
        run: ./scripts/test-ui.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BLEStudio-win-x64
          path: |
            artifacts/release/**
            artifacts/test-results/**
            artifacts/ui-smoke/*.json
            artifacts/ui-smoke/*.png
            artifacts/ui-smoke/failure.txt
