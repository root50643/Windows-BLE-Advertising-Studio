name: Tracking service validation
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API and cryptographic regression tests
        run: |
          python -m pip install -r services/tracking-service/requirements.txt pytest
          python -m pytest services/tracking-service/test_service.py -q --junitxml=service-tests.xml
          docker compose -f deploy/compose.yaml config --no-interpolate --quiet
      - name: Build Linux deployment image and validate pinned provider interfaces
        run: |
          docker build -f deploy/Dockerfile -t ble-studio-service:ci .
          docker run --rm ble-studio-service:ci python google_adapter.py --self-test
          docker build -f deploy/Dockerfile.apple -t ble-studio-apple:ci .
          docker run --rm ble-studio-apple:ci python -m compileall -q endpoint
          docker run --rm -e DOMAIN=ci.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check container API lifecycle with private fixture secrets
        shell: bash
        run: |
          testdir=$(mktemp -d)
          mkdir "$testdir/data" "$testdir/secrets"
          python -c "import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())" > "$testdir/secrets/key"
          printf '%s' 'ci-offline-fixture-password-only' > "$testdir/secrets/password"
          docker run -d --name ble-studio-ci --user "$(id -u):$(id -g)" -p 127.0.0.1:18765:8080 --read-only --tmpfs /tmp -v "$testdir/data:/data" -v "$testdir/secrets:/run/secrets:ro" -e PUBLIC_URL=https://ci.invalid -e MASTER_KEY_FILE=/run/secrets/key -e OWNER_PASSWORD_FILE=/run/secrets/password ble-studio-service:ci
          trap 'docker logs ble-studio-ci; docker rm -f ble-studio-ci' EXIT
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:18765/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/api/trackers)" = 401
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-service-validation
          path: service-tests.xml
